name = "complexitylib"
version = "0.1.0"
defaultTargets = ["Complexitylib"]

[[require]]
name = "cslib"
git = "https://github.com/leanprover/cslib"
rev = "d9be64196bf145edd019f1ccfeaee0c11166ba6b"

# Mathlib last, so its dependency versions take precedence over cslib's (Lake's advice).
